name: Update GitHub Stats SVG

on:
  schedule:
    # Run daily at 00:00 UTC (09:00 JST)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scripts/github-stats-svg/package-lock.json

      - name: Install dependencies
        working-directory: scripts/github-stats-svg
        run: npm ci

      - name: Generate GitHub Stats SVG (nord)
        env:
          # Tip: To include private repository commits/stats, create a PAT (read:user, repo)
          # and save it as a repository secret named GH_STATS_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          npx --prefix scripts/github-stats-svg tsx scripts/github-stats-svg/src/cli.ts \
            --theme nord \
            --output assets/github-stats.svg

      - name: Commit and push updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update GitHub stats SVG"
          git push
